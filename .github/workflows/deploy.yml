name: Deploy ASTITVA CONSTRUCTION to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prune unused PNG frames from deployment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const framesDir = 'dist/frames';
          const webpDir = 'dist/frames_webp';

          if (!fs.existsSync(framesDir)) {
            throw new Error('dist/frames directory is missing');
          }

          if (!fs.existsSync(webpDir)) {
            throw new Error('dist/frames_webp directory is missing');
          }

          const keep = new Set();

          for (let i = 1; i <= 359; i++) {
            const number = String((i - 1) * 4 + 1).padStart(4, '0');
            keep.add(`frame_${number}.png`);

            if (!fs.existsSync(path.join(webpDir, `frame_${number}.webp`))) {
              throw new Error(`Missing WebP frame: frame_${number}.webp`);
            }
          }

          for (const file of keep) {
            if (!fs.existsSync(path.join(framesDir, file))) {
              throw new Error(`Missing fallback PNG: ${file}`);
            }
          }

          let removed = 0;

          for (const file of fs.readdirSync(framesDir)) {
            if (/^frame_\d{4}\.png$/i.test(file) && !keep.has(file)) {
              fs.unlinkSync(path.join(framesDir, file));
              removed++;
            }
          }

          const remaining = fs.readdirSync(framesDir)
            .filter(file => /^frame_\d{4}\.png$/i.test(file));

          if (remaining.length !== 359) {
            throw new Error(`Expected 359 PNG frames, found ${remaining.length}`);
          }

          console.log('Verified 359 WebP frames and 359 PNG fallbacks.');
          console.log(`Removed ${removed} unused PNG frames from dist only.`);
          NODE

          echo "Final deployment artifact size:"
          du -sh dist

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
